      <stop offset="55%" stop-color="#e8c547" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e8c547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sk-platinum" x1="28%" y1="8%" x2="72%" y2="100%">
