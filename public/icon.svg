      <stop offset="0%" stop-color="#1a1824"/>
      <stop offset="42%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="sk-bloom" cx="48%" cy="36%" r="38%">
